# /etc/nginx/sites-available/crm — CRM base (rama crm-base) en http://72.60.15.125:8080
server {
    include snippets/acme-challenge.conf;
    listen 8080;
    server_name 72.60.15.125;

    client_max_body_size 50m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:18090/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:18090/health;
    }

    location / {
        proxy_pass http://127.0.0.1:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
