# Vicar en el VPS compartido (72.60.15.125). Traefik (container n8n-traefik-1) enruta directo
# a los procesos PM2, que escuchan en 172.18.0.1 (gateway de n8n_default): no pasa por Nginx.
# Va en /docker/n8n/dynamic/vicar.yml; Traefik lo toma solo (file provider con watch), sin
# reiniciar el container, que es el mismo que sirve n8n.
http:
  routers:
    vicar-api:
      rule: "Host(`vicar.consultoriadigital.io`) && (PathPrefix(`/api/v1`) || Path(`/health`))"
      priority: 100
      entryPoints:
        - websecure
      service: vicar-backend
      tls:
        certResolver: mytlschallenge
    vicar:
      rule: "Host(`vicar.consultoriadigital.io`)"
      priority: 10
      entryPoints:
        - websecure
      service: vicar-frontend
      tls:
        certResolver: mytlschallenge

  services:
    vicar-backend:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://172.18.0.1:3830"
    vicar-frontend:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://172.18.0.1:3831"
