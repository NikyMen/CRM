# Vicar Inmobiliaria: contenedores y volúmenes propios para no compartir ni pisar
# los de ROMEZ (crm_postgres, crm_redis, crm_romez_*) ni los de Wolves. Levantar siempre con
#   docker compose -p crm-vicar up -d postgres redis
services:
  postgres:
    container_name: vicar_postgres
  redis:
    container_name: vicar_redis

volumes:
  postgres_data:
    name: crm_vicar_postgres_data
  redis_data:
    name: crm_vicar_redis_data
