name: crm-base

services:
  postgres:
    image: postgres:16-alpine
    container_name: crmbase_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crmbase_redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/DockerFile
    container_name: crmbase_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm_db}
      - DIRECT_URL=postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - FRONTEND_URL=${FRONTEND_URL:-http://72.60.15.125:8080}
      - WHATSAPP_AUTH_DIR=.data/whatsapp-auth
      - WHATSAPP_MEDIA_DIR=.data/whatsapp-media
    # Solo localhost: nginx publica todo en el puerto 8080 (ver ops/nginx-crm-base.conf)
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18090}:3000"
    volumes:
      - ./.data/whatsapp-auth:/app/backend/.data/whatsapp-auth
      - ./.data/whatsapp-media:/app/backend/.data/whatsapp-media

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://72.60.15.125:8080/api/v1}
    container_name: crmbase_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-18091}:3001"

volumes:
  postgres_data:
    name: crmbase_postgres_data
  redis_data:
    name: crmbase_redis_data
